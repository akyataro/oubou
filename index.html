<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>横暴編集長</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#eef1f5;--ink:#1b2430;--red:#d6303b;--hl:#ffe45c;--line:#c9d0da}
@media(prefers-color-scheme:dark){:root{--paper:#161b23;--ink:#e8ecf2;--line:#343d4b}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.6 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
#app{max-width:640px;margin:0 auto;padding:12px}
h1,.title{font-family:"Noto Serif JP","Hiragino Mincho ProN",serif;font-weight:900}
h1{font-size:28px;margin:8px 0 4px}
.sub{color:var(--red);font-weight:700;margin:0 0 16px}
input{width:100%;font-size:20px;padding:14px;border:2px solid var(--ink);border-radius:4px;background:transparent;color:var(--ink);margin:6px 0}
button{font:inherit;font-size:20px;font-weight:700;padding:16px 18px;border:2px solid var(--ink);border-radius:4px;background:var(--ink);color:var(--paper);cursor:pointer}
button.red{background:var(--red);border-color:var(--red);color:#fff}
button.ghost{background:transparent;color:var(--ink)}
button.wide{width:100%;margin-top:8px}
button:disabled{opacity:.35}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.bar{display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:12px;font-weight:700}
.score{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 16px;font-size:16px}
.score span{border:1px solid var(--line);padding:3px 10px;border-radius:99px}
.score i{font-style:normal;color:var(--red);font-weight:700;margin-left:8px}
.score .ok{background:var(--hl);color:#1b2430;border-color:var(--hl)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.card{padding:16px 6px;font-size:clamp(19px,5.6vw,28px);line-height:1.3;word-break:keep-all;overflow-wrap:anywhere;border:2px solid var(--line);border-radius:4px;background:transparent;color:var(--ink);font-weight:700;text-align:center}
.card small{display:block;font-size:13px;color:var(--red);font-weight:700}
.card.sel{border-color:var(--red);background:var(--hl);color:#1b2430}
.card:disabled,.cover:disabled{opacity:1}
.cover{border:2px solid var(--ink);border-left:12px solid var(--red);padding:16px;margin:10px 0;font-size:clamp(22px,6vw,30px);background:transparent;color:var(--ink);text-align:left;width:100%;display:block}
.cover.win{background:var(--hl);color:#1b2430}
.cover.dash{border-style:dashed;border-left-style:dashed;opacity:.75}
.cover small{display:block;font:16px system-ui;color:var(--red);font-weight:700}
.msg{padding:10px;border:2px dashed var(--red);margin:10px 0}
.msg small{color:inherit;opacity:.8}
.code{font-size:40px;letter-spacing:.2em;font-weight:900}
.step{display:flex;align-items:center;justify-content:center;gap:16px;font-size:24px;font-weight:700;margin:8px 0 16px}
img{display:block;margin:8px auto;background:#fff;padding:6px}
h2{font-size:18px;margin:16px 0 4px}
</style></head><body><div id="app"></div>
<script src="config.js"></script>
<script>
const ROOM=new URLSearchParams(location.search).get('room')||'';
let S=null,me=null,code=null,base=location.origin+location.pathname,sel={f:null,h:null},err='';
const $=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const call=(a,p)=>{
  const q=new URLSearchParams({a});
  Object.entries(p||{}).forEach(([k,v])=>{if(v!==null&&v!==undefined)q.set(k,v)});
  return fetch(GAS+'?'+q.toString()).then(r=>r.json());
};
try{const k=sessionStorage.getItem('obh');if(k){const o=JSON.parse(k);if(!ROOM||ROOM===o.code){code=o.code;me=o.id}}}catch(e){}

async function act(a,p){
  err='';
  try{const r=await call(a,Object.assign({code,id:me},p||{}));
    if(r.err){err=r.err;render();return}
    if(r.id&&r.code){code=r.code;me=r.id;try{sessionStorage.setItem('obh',JSON.stringify({code,id:me}))}catch(e){}poll();return}
    if(a==='take'||a==='submit')sel={f:null,h:null};
    S=r;render();
  }catch(e){err='通信に失敗しました。もう一度お試しください';render()}
}
async function poll(){
  if(!code)return;
  try{const r=await call('get',{code,id:me,v:S?S.v:null});
    if(r.same)return;
    if(r.err){err=r.err;code=null;S=null;try{sessionStorage.removeItem('obh')}catch(e){}render();return}
    if(!S||r.v!==S.v){if(S&&(r.phase!==S.phase||r.round!==S.round))sel={f:null,h:null};S=r;render()}}catch(e){}
}
setInterval(poll,3000);poll();

function start(){
  const n=document.getElementById('name').value,c=document.getElementById('code').value.trim();
  c?act('join',{name:n,code:c}):act('create',{name:n});
}
function pick(k,i){sel[k]=i;render()}
const card=(c,on,fn)=>`<button class="card ${on?'sel':''}" ${fn?`onclick="${fn}"`:'disabled'}><small>${c.k==='T'?'上':'下'}</small>${esc(c.s)}</button>`;
const cover=(small,text,cls)=>`<div class="cover title ${cls||''}"><small>${esc(small)}</small>${esc(text)}</div>`;

function render(){
  if(!S){
    $.innerHTML=`<h1>横暴編集長</h1><p class="sub">タイトル大喜利</p>
    <input id="name" placeholder="名前（10文字まで）" maxlength="10" autocomplete="off">
    <input id="code" placeholder="部屋コード（参加するとき）" inputmode="numeric" value="${esc(ROOM)}">
    <button class="red wide" onclick="start()">${ROOM?'参加する':'部屋を作る／参加する'}</button>
    ${err?`<div class="msg">${esc(err)}</div>`:''}`;return;
  }
  const P=S.players,ph=S.phase,nm=id=>(P.find(x=>x.id===id)||{}).name||'',host=S.host===S.me,isChief=S.chief===S.me;
  const title=ph==='lobby'?'準備中':ph==='vote'?'最終投票':ph==='final'?'結果発表':`第${S.round}号／全${S.rounds}号`;
  let h=`<div class="bar"><span>部屋 ${S.code}</span><span>${title}</span></div>`;
  h+=`<div class="score">`+P.map(x=>{
    const on=(ph==='take'||ph==='present')?S.turn===x.id:(ph==='write'||ph==='vote')?x.done:false;
    const ch=x.id===S.chief&&!['lobby','vote','final'].includes(ph);
    return `<span class="${on?'ok':''}"><b>${esc(x.name)}</b>${ch?'<i>編集長</i>':''}</span>`}).join('')+`</div>`;

  if(ph==='lobby'){
    h+=`<p>参加者が集まったら開始します（${P.length}人／2〜8人）</p><div class="code">${S.code}</div>`;
    h+=`<img alt="参加用QRコード" width="200" height="200" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(base+'?room='+S.code)}">`;
    if(host)h+=`<h2>会議の回数</h2><div class="step"><button class="ghost" ${S.rounds<=1?'disabled':''} onclick="act('setrounds',{n:${S.rounds-1}})">−</button><span>全${S.rounds}回</span><button class="ghost" ${S.rounds>=10?'disabled':''} onclick="act('setrounds',{n:${S.rounds+1}})">＋</button></div><button class="red wide" onclick="act('start')">ゲーム開始</button>`;
    else h+=`<p>会議は全${S.rounds}回です。ホストが開始するのを待っています</p>`;

  }else if(ph==='take'){
    const my=S.turn===S.me;
    h+=`<div class="msg">${my?'あなたの番です。場から札を1枚取ってください':esc(nm(S.turn))+' さんが札を選んでいます'}<br><small>取る順：${S.order.map(i=>esc(nm(i))).join(' → ')}</small></div>`;
    h+=`<h2>場の札</h2><div class="cards">`+S.field.map((c,i)=>card(c,sel.f===i,my?`pick('f',${i})`:null)).join('')+`</div>`;
    if(my)h+=`<button class="red wide" ${sel.f===null?'disabled':''} onclick="act('take',{pos:sel.f})">この札を取る</button>`;
    if(S.taken)h+=`<h2>あなたが取った札（必ず使います）</h2><div class="cards">`+card(S.taken,true,null)+`</div>`;
    h+=`<h2>あなたの手札</h2><div class="cards">`+S.hand.map(c=>card(c,false,null)).join('')+`</div>`;

  }else if(ph==='write'){
    if(S.mine){
      h+=`<div class="msg">提出しました。全員の提出を待っています</div>`+cover('あなたのタイトル',S.mine);
    }else{
      const tk=S.taken;
      h+=`<h2>取った札（必ず使います）</h2><div class="cards">`+card(tk,true,null)+`</div>`;
      h+=`<h2>手札から${tk.k==='T'?'下':'上'}の札を1枚選ぶ</h2><div class="cards">`+S.hand.map((c,i)=>c.k!==tk.k?card(c,sel.h===i,`pick('h',${i})`):'').join('')+`</div>`;
      const ok=sel.h!==null;
      const hc=ok?S.hand[sel.h]:null;
      h+=`<div class="cover title">${ok?esc(tk.k==='T'?tk.s+' '+hc.s:hc.s+' '+tk.s):'手札から1枚選んでください'}</div>`;
      h+=`<button class="red wide" ${ok?'':'disabled'} onclick="act('submit',{h:sel.h})">このタイトルで提出</button>`;
    }

  }else if(ph==='present'){
    const my=S.turn===S.me;
    if(S.cur){
      h+=`<div class="msg">${esc(nm(S.cur.id))} さんの発表</div>`+cover(nm(S.cur.id),S.cur.text,'win');
      if(my)h+=`<button class="red wide" onclick="act('endshow')">発表終了</button>`;
    }else{
      h+=`<div class="msg">${my?'あなたの番です。準備ができたら発表してください':esc(nm(S.turn))+' さんの発表を待っています'}</div>`;
      if(my)h+=`<button class="red wide" onclick="act('reveal')">発表する</button>`;
    }
    if(S.mine&&!S.presented.includes(S.me)&&!(S.cur&&S.cur.id===S.me))h+=cover('あなたのタイトル（まだ公開されていません）',S.mine);

  }else if(ph==='judge'){
    h+=`<div class="msg">${isChief?'あなたが横暴編集長です。採用するタイトルを選んでください':esc(nm(S.chief))+' 編集長が選んでいます'}</div>`;
    h+=S.subs.map(s=>{
      if(isChief&&s.id===S.me)return cover('あなたの案（選べません）',s.text,'dash');
      return `<button class="cover title" ${isChief?`onclick="act('choose',{winner:'${s.id}'})"`:'disabled'}><small>${esc(nm(s.id))}</small>${esc(s.text)}</button>`}).join('');

  }else if(ph==='result'){
    const w=S.subs.find(s=>s.id===S.winner);
    h+=`<div class="msg">${esc(nm(S.chief))} 編集長の決定</div>`+cover('採用：'+nm(S.winner),w?w.text:'','win');
    h+=`<h2>ほかの案</h2>`+S.subs.filter(s=>s.id!==S.winner).map(s=>cover(nm(s.id),s.text)).join('');
    h+=isChief?`<button class="red wide" onclick="act('next')">${S.round>=S.rounds?'最終投票へ':'次の号へ'}</button>`:`<p>編集長が${S.round>=S.rounds?'最終投票':'次の号'}に進めます</p>`;

  }else if(ph==='vote'){
    h+=`<div class="msg">${S.myVote===null?'各号で採用されたタイトルです。一番いいと思うものに投票してください（自分の作品も選べます）':'投票しました。全員の投票を待っています'}</div>`;
    h+=S.hist.map((x,i)=>`<button class="cover title ${S.myVote===i?'win':''}" ${S.myVote===null?`onclick="act('vote',{idx:${i}})"`:'disabled'}><small>第${x.r}号・${esc(nm(x.id))}</small>${esc(x.text)}</button>`).join('');

  }else if(ph==='final'){
    const mx=Math.max(...S.votes);
    const idx=S.hist.map((_,i)=>i).sort((a,b)=>S.votes[b]-S.votes[a]||a-b);
    h+=`<div class="msg">出版決定${S.votes.filter(v=>v===mx).length>1?'（同率1位は全て出版）':''}</div>`;
    h+=idx.map(i=>{const x=S.hist[i];return cover(`第${x.r}号・${nm(x.id)}・${S.votes[i]}票`,x.text,S.votes[i]===mx?'win':'')}).join('');
    h+=host?`<button class="red wide" onclick="act('again')">もう一度遊ぶ</button>`:`<p>ホストが「もう一度遊ぶ」を選べます</p>`;
  }
  if(err)h+=`<div class="msg">${esc(err)}</div>`;
  $.innerHTML=h;
}
render();
</script></body></html>
